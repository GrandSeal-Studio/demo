<meta name="viewport" content="width=device-width,initial-scale=1">
<title>德州扑克 PRD 文档中心</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>/* 视觉规范：PRD 01 第 9 节 */
:root{
  --primary:#006E52; --primary-weak:#E3F1EC; --text:#13181C; --text-2:#7A828C;
  --bg-green:#F0F7F5; --bg-gray:#F2F5F7; --bg-card:#F5F7FA; --icon-bg:#F0F5F5;
  --line:#D4DEDE; --nav-bg:#F7FAFB; --gold:#F59906; --gold-line:#FFD161;
  --danger:#D93025; --warn:#F59906;
  --stage:#E9EEF0; --panel:#FFFFFF;
  --r-card:12px; --r-banner:16px; --r-btn:8px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Inter,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background:var(--stage);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:inherit}
.hidden{display:none!important}

/* ---------- 外框：顶部模式切换 + 舞台 + 导览面板 ---------- */
.topbar{height:52px;display:flex;align-items:center;gap:16px;padding:0 20px;background:#13181C;color:#fff}
.topbar .brand{font-weight:600;font-size:15px}
.topbar .seg{display:flex;background:#2A3238;border-radius:8px;padding:3px}
.topbar .seg a{text-decoration:none}
.topbar .seg button{padding:6px 14px;border-radius:6px;color:#C9D1D6;font-size:13px}
.topbar .seg button.on{background:var(--primary);color:#fff}
.topbar .sp{flex:1}
.topbar .note{color:#9AA4AB;font-size:12px}
.layout{display:flex;height:calc(100% - 52px)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px}
.panel{width:340px;background:var(--panel);border-left:1px solid #DDE3E6;display:flex;flex-direction:column;overflow:hidden}
.panel h3{font-size:13px;margin:14px 16px 8px;color:var(--text-2);font-weight:600}
.panel .box{margin:0 16px 8px}
.panel .roles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.panel .roles button{padding:8px 4px;border:1px solid var(--line);border-radius:8px;font-size:12px}
.panel .roles button.on{border-color:var(--primary);background:var(--primary-weak);color:var(--primary);font-weight:600}
.panel .jumps{display:flex;flex-wrap:wrap;gap:6px}
.panel .jumps button{padding:5px 9px;background:var(--bg-gray);border-radius:14px;font-size:12px}
.panel .jumps button:hover{background:var(--primary-weak);color:var(--primary)}
.panel .ref{background:var(--bg-green);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.6}
.panel .ref b{color:var(--primary)}
.panel .log{flex:1;overflow:auto;margin:0 16px 12px;border:1px solid #E6EBEE;border-radius:8px;font-family:ui-monospace,Menlo,monospace;font-size:11px}
.panel .log div{padding:5px 8px;border-bottom:1px solid #F0F3F5;display:flex;gap:6px}
.panel .log .t{color:var(--text-2)} .panel .log .k{font-weight:600} .panel .log .F{color:#2563EB} .panel .log .S{color:var(--primary)}
.panel .log .kv{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel .reset{margin:0 16px 14px;padding:8px;border:1px solid var(--line);border-radius:8px;font-size:12px}

/* ---------- 手机 ---------- */
.phone{width:390px;height:844px;background:#fff;border-radius:40px;box-shadow:0 20px 60px rgba(19,24,28,.18),0 0 0 10px #13181C;position:relative;overflow:hidden;flex-shrink:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll::-webkit-scrollbar{width:0}
.pad{padding:0 20px}

/* 顶栏 01 第 2.3 节 */
.hdr{height:64px;display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0;background:#fff}
.hdr .logo{font-weight:600;font-size:24px}
.hdr .title{font-weight:600;font-size:19px}
.hdr .back{font-size:26px;line-height:1;width:24px}
.hdr .sp{flex:1}
.hdr .ico{width:36px;height:36px;border-radius:18px;background:var(--icon-bg);display:flex;align-items:center;justify-content:center;font-size:16px;position:relative}
.hdr .ico .dot{position:absolute;top:4px;right:4px;min-width:14px;height:14px;border-radius:7px;background:var(--danger);color:#fff;font-size:9px;line-height:14px;text-align:center;padding:0 3px}

/* 底部导航 01 第 2.1 节 */
.nav{height:70px;flex-shrink:0;background:var(--nav-bg);display:flex;align-items:center;justify-content:space-between;padding:0 20px 6px;position:relative;border-top:1px solid #EDF1F2}
.nav button{width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--text-2)}
.nav button .i{font-size:20px;line-height:26px}
.nav button.on{color:var(--text);font-weight:600}
.nav .bulge{position:relative;height:50px}
.nav .bulge .w{position:absolute;left:10px;top:-17px;width:44px;height:44px;border-radius:22px;background:var(--gold);border:2px solid var(--gold-line);box-shadow:0 3px 8px rgba(173,97,0,.22);display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.nav .bulge span.l{position:absolute;top:32px;left:0;width:64px;text-align:center}

/* 通用元件 */
.card{background:var(--bg-card);border-radius:var(--r-card);padding:14px}
.card.g{background:var(--bg-green)}
.card.w{background:#fff;border:1px solid #E6EBEE}
.btn{height:44px;border-radius:22px;background:var(--primary);color:#fff;font-weight:600;font-size:14px;width:100%;display:flex;align-items:center;justify-content:center}
.btn.sec{background:var(--bg-green);color:var(--primary)}
.btn.dark{background:var(--text)}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--text)}
.btn.danger{background:var(--danger)}
.btn.sm{height:34px;border-radius:8px;font-size:13px;width:auto;padding:0 14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column;gap:10px}
.gap8{gap:8px}.gap12{gap:12px}.gap16{gap:16px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mb12{margin-bottom:12px}
.muted{color:var(--text-2)} .small{font-size:11px} .h1{font-size:19px;font-weight:600} .h2{font-size:16px;font-weight:600} .h3{font-size:14px;font-weight:600}
.big{font-size:26px;font-weight:600}
.green{color:var(--primary)} .red{color:var(--danger)} .gold{color:var(--gold)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--bg-gray);color:var(--text-2)}
.tag.g{background:var(--primary-weak);color:var(--primary)} .tag.r{background:#FDECEA;color:var(--danger)} .tag.o{background:#FFF3DF;color:#B56A00}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 10px;flex-shrink:0}
.pills::-webkit-scrollbar{height:0}
.pill{flex-shrink:0;min-width:64px;height:30px;padding:0 14px;border-radius:15px;background:var(--bg-gray);font-size:12px}
.pill.on{background:var(--text);color:#fff;font-weight:600}
.tabs{display:flex;border-bottom:1px solid #E6EBEE;margin:0 20px}
.tabs button{flex:1;height:40px;font-size:13px;color:var(--text-2);border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);font-weight:600;border-color:var(--primary)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--text-2)}
.input{height:48px;border:1px solid var(--line);border-radius:var(--r-btn);padding:0 14px;background:#fff;width:100%;font-size:14px;outline:none}
.input:focus{border-color:var(--primary)}
.input.err{border-color:var(--danger)}
.ferr{color:var(--danger);font-size:12px;min-height:16px}
.list .it{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #EEF2F3}
.list .it:last-child{border-bottom:0}
.list .it .grow{flex:1}
.chev{color:var(--text-2);font-size:18px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.qe{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.qe .b{width:44px;height:44px;border-radius:14px;background:var(--icon-bg);display:flex;align-items:center;justify-content:center;font-size:20px}
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:13px}
.kv>span:first-child{color:var(--text-2)} /* R14-QA-04：只作用于栏位名，避免值内第一张牌（如 6♥）被染灰 */
.divider{height:1px;background:#EEF2F3;margin:8px 0}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:48px 20px;color:var(--text-2);text-align:center}
.empty .ill{font-size:40px}
.banner{height:200px;border-radius:var(--r-banner);background:linear-gradient(135deg,#0B3D30,#006E52 60%,#1E8C6E);color:#fff;padding:22px;position:relative;overflow:hidden}
.banner .k{font-size:11px;color:#BFE5D6;font-weight:600;letter-spacing:.5px}
.banner .t{font-size:24px;font-weight:600;margin-top:8px}
.banner .s{font-size:13px;color:#E0E5E8;margin-top:6px}
.banner .suit{position:absolute;right:-10px;bottom:-30px;font-size:150px;opacity:.12}
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--line)} .dots i.on{width:20px;background:var(--primary)}
.marquee{height:34px;border-radius:8px;background:var(--bg-green);display:flex;align-items:center;gap:10px;padding:0 12px;font-size:12px;overflow:hidden}
.marquee .mtxt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.check{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.5}
.check input{margin-top:3px;accent-color:var(--primary)}
.switch{width:40px;height:24px;border-radius:12px;background:var(--line);position:relative;flex-shrink:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:10px;background:#fff;transition:.2s}
.switch.on{background:var(--primary)} .switch.on::after{left:18px}
.progress{height:6px;border-radius:3px;background:var(--bg-gray);overflow:hidden} .progress i{display:block;height:100%;background:var(--primary)}
.skeleton{background:linear-gradient(90deg,#F2F5F7 25%,#E8EDF0 50%,#F2F5F7 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.otp{display:flex;gap:8px;justify-content:space-between}
.otp input{width:44px;height:52px;text-align:center;font-size:20px;font-weight:600;border:1px solid var(--line);border-radius:8px}

/* 浮层：Toast / 弹窗 / 底部面板 01 第 6.6、6.7 节 */
.layer{position:absolute;inset:0;z-index:50;display:flex}
.mask{position:absolute;inset:0;background:rgba(19,24,28,.48)}
.toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:90;background:rgba(19,24,28,.9);color:#fff;border-radius:8px;padding:12px 16px;display:flex;gap:8px;align-items:center;max-width:300px;font-size:14px;line-height:1.4;pointer-events:none;animation:fade .2s}
.toast .ic{font-weight:600}
.toast .code{font-size:10px;opacity:.6;margin-left:4px}

.board{position:absolute;left:50%;top:286px;transform:translateX(-50%);display:flex;gap:5px;align-items:flex-start} /* R27-UI-50／51：公共牌在底池标签下方；空牌位与已发牌同尺寸 */

.pot{position:absolute;left:50%;top:248px;transform:translateX(-50%);background:rgba(0,0,0,.35);padding:4px 12px;border-radius:12px;font-size:12px;white-space:nowrap}

 {h:'桌子来源',t:[['项目','官方俱乐部桌','私人俱乐部桌'],['开桌','系统自动，每种“玩法 × 桌型 × 盲注”至少 1 张有空位','俱乐部主手动'],['可参加','所有人','该俱乐部成员'],['Jackpot / 全押兑现 / 多次发牌','都开，不能关','俱乐部主可设开关'],['同 IP / GPS','都开，不能关','都开，不能关（入座时自动检查）'],['抽水归属','100% 归平台','按分成表分给俱乐部主']]},
 {h:'私人桌设定',li:['可设：玩法、桌型、盲注（只能从平台级别表选）、带入 100～500BB。','可设：各功能开关（同 IP / GPS 除外，一律开启）、自动重开。','牌桌时长：1 / 2 / 4 / 8 / 12 / 24 小时。','Straddle：只限 UTG 下 2BB。','剩 10 分钟且桌上 ≥ 2 人自动延长 1 小时。','抽水与倒数时间不可设定。','开桌后规则不能修改。','开桌门槛：创建者可用余额须大于 0；不收开桌费、不占用资金。','入座无审批：系统自动验证成员资格、余额、带入范围、冻结 / 冷静期 / 自我排除、同 IP、GPS 500 米、VPN / 代理，全部通过即入座。','暂停牌桌：时长暂停计算、不能入座，最长 30 分钟自动恢复。']},
 {h:'玩法与桌型',li:['玩法：NLH、PLO4、PLO5、6+ 短牌、AoF；目前开放 NLH、AoF，其余标“即将开放”。','桌型：6 人桌、9 人桌；AoF 只开 6 人桌，只能全押或弃牌。','PLO 限池加注；6+ 短牌只用 6～A 共 36 张，每人前注 1、庄位另加 1，1BB = 1 前注。']},
 {h:'盲注级别、抽水封顶与兑现上限（NLH / PLO4 / PLO5 / AoF）',t:[['盲注','抽水封顶','全押兑现单手上限'],['0.05/0.1','0.4（4BB）','20（200BB）'],['0.1/0.2','0.8（4BB）','40（200BB）'],['0.25/0.5','1.5（3BB）','100（200BB）'],['0.5/1','3（3BB）','200（200BB）'],['1/2','6（3BB）','400（200BB）'],['2/4','10（2.5BB）','800（200BB）'],['5/10','20（2BB）','2,000（200BB）'],['10/20','40（2BB）','4,000（200BB）']]},
 {h:'6+ 短牌级别',t:[['前注','抽水封顶','全押兑现单手上限'],['0.1','0.4（4 前注）','20（200 前注）'],['0.25','1（4 前注）','50（200 前注）'],['0.5','1.5（3 前注）','100（200 前注）'],['1','3（3 前注）','200（200 前注）'],['2','5（2.5 前注）','400（200 前注）'],['5','10（2 前注）','1,000（200 前注）']]},
 {h:'抽水与带入',li:['抽水 5%，封顶按级别。','没看到翻牌不抽水。','多次发牌不另抽。','边池按金额比例分摊。','带入 100～500BB 自由输入，快捷 100 / 200 / 500BB，默认 200BB；AoF 固定 10BB。','补充带入只在两手之间生效；离桌后 30 分钟内回同一桌，带入不能低于离桌筹码（30003）。','所有现金桌须授权定位才能入座。','同 IP 不能同桌。','GPS 相距小于 500 米不能同桌。']},
 {h:'暂离、断线与结算',li:['超时即弃牌并暂离，照扣盲注，满 10 分钟自动离桌结算。','断线超过 60 秒弹“连接已中断”，可重新连接或返回首页（座位保留）。','离桌：当前这一手结束后离桌 → 结算中 → 结算完成；净变化 = 累计带出 − 累计带入。']},
 {h:'附加功能',t:[['功能','规则'],['Jackpot','分池：全平台共用、按级别分池\n注入：见翻牌且底池 ≥ 30BB → 注入 1BB（9 人桌 0.8BB）\n触发：NLH AAATT 及以上被击败；PLO4 2222；PLO5 8888；短牌 6666\n分配：冤家牌方 10% / 胜方 3% / 其他拿到牌者每人 0.8%'],['全押兑现','条件：两人对决（不含 AoF）、翻牌后河牌前、胜率 > 60%、底池 > 20BB\n金额 =（底池 − 抽水 − Jackpot 注入）× 胜率，再扣 1% 手续费'],['多次发牌','只限两人全押且无后续下注；最多 3 次，双方同意才生效；拒绝或超时只发 1 次']]},
 {h:'倒数时间（全平台统一）',t:[['项目','时间','超时处理'],['行动时间','翻牌前没人加注 10 秒；其他 15 秒；AoF 10 秒','使用时间银行'],['时间银行','入座 30 秒，每 50 手 +10 秒，最多 60 秒','弃牌并暂离'],['Straddle 决定','5 秒','—'],['全押兑现决定','10 秒','不兑现'],['多次发牌决定','10 秒','发 1 次'],['结算展示','2.5 秒','弹出本手结算视窗'],['带入弹窗','30 秒','释放座位'],['牌桌时长提醒','剩 10 分钟','—']],note:'延时卡每手最多 1 张，+30 秒；观战聊天只能快捷语与表情，发言间隔 3 秒'}
]},
{id:'06',title:'俱乐部',purpose:'定义俱乐部创建、加入、角色权限、成员与牌局管理、关闭解散、分成与报表。',sec:[
 {h:'创建条件',t:[['对象','条件'],['一般玩家','完成实名认证，且现金桌与赛事累计流水 ≥ 5,000'],['合作代理','后台标记；免流水门槛，仍须实名'],['创建数量','每人最多 5 个（含已关闭、未解散），已达上限 50013']],
  li:['名称：必填、40 字内、站内唯一（50002）。','名称不可含“官方”“平台”“客服”“admin”（50011）。','介绍：必填、200 字内。','新建只能选 5 张内建徽章头像；建立后创建者可上传自定义图片（AI 审核，敏感转人工，未通过 50012）。']},
 {h:'加入俱乐部',li:['搜索名称 / ID → 申请（备注最多 50 字）→ 待审核 → 通过 / 拒绝（须填原因）。','7 天未审核自动拒绝。','可设免审核。','加入数量与成员人数不限。','邀请链接受邀者仍须申请，不能绕过审核。']},
 {h:'角色与权限',t:[['权限','创建者','管理员','一般玩家'],['查看资料与成员','✓','✓','✓'],['编辑资料 / 任免管理员 / 移出成员','✓','✗','✗'],['审核入会申请','✓','✓','✗'],['开局（私人现金桌、赛事、保底赛）','✓','✗','✗'],['请离桌牌桌','✓','✓','✗'],['查看报表','✓','设置开启后 ✓','✗'],['解散牌局、取消赛事','✓','✗','✗'],['关闭、解散俱乐部','✓','✗','✗']],note:'管理员最多 5 人；无权限提示 00004'},
 {h:'牌局管理',li:['同时牌局上限：私人现金桌 20 张（30010）、赛事 10 场（40016）。','开赛模板：MTT 标准（每级 10 分钟）/ 快速（5 分钟）/ 极速（3 分钟）、SNG 6 人、赏金赛标准。','报名金额：10 / 50 / 100 / 200（另加 10% 服务费）。','保底金额：500 / 1,000 / 3,000 / 10,000（SNG 不适用）。','已关闭不能开新局（50014）；余额为负不能开局（20008）；开私人现金桌、赛事须可用余额大于 0，私人现金桌不收开桌费、不占用资金。']},
 {h:'关闭与解散',li:['关闭：不能加入新成员、不能开新局。','关闭：高风险操作，按钮倒数 3 秒 + 验证码 + 通行密钥。','关闭：可随时重新开启。','解散：须先关闭、无进行中牌局且全部结算、成员无未使用的本俱乐部门票；不满足提示 50007。','未结分成照常于下次周结发给创建者。']},
 {h:'分成与报表',t:[['对象','赛事服务费','私人桌抽水'],['一般俱乐部主','阶梯表（00 第 7.4 节）','分成表（05 第 6.2 节）'],['合作代理','固定比例（后台逐个设定）','固定比例（后台逐个设定）']],li:['报表页签：近 7 天、牌局明细、分成（只有创建者）；只计算已结算记录。']}
]},
{id:'07',title:'赛事',purpose:'定义 MTT / SNG / 赏金赛 / 卫星赛 / 多阶段赛事的赛制、费用、模板、报名取消、比赛进行与结算。',sec:[
 {h:'赛制与费用',t:[['赛制','说明'],['MTT 锦标赛','多桌，按名次分配奖池'],['SNG 单桌赛','单桌 6 人，坐满即开赛'],['赏金赛','锦标赛 + 固定淘汰赏金（非渐进式）'],['卫星赛','奖励为指定主赛门票'],['多阶段赛事','连续 3 天分阶段；目前“即将开放”']],
  li:['报名费 = 报名金额 + 服务费（报名金额 10%），例：100 + 10 = 110。','赏金赛报名金额拆为名次奖池与赏金，默认各 50%。','重进：重新支付报名费（含服务费），重拿起始筹码。','只看得到已加入俱乐部的赛事；私人赛事只由创建者以平台模板开设。']},
 {h:'模板：速度与起始筹码',li:['速度：标准每级 10 分钟。','速度：快速每级 5 分钟。','速度：极速每级 3 分钟。','起始筹码：MTT / 赏金赛 / 卫星赛 10,000；SNG 3,000（盲注按比例缩小）。','延迟报名默认第 4 级结束截止；重进默认第 4 级结束前、最多 1 次。','最低开赛人数：MTT / 赏金赛 / 卫星赛默认 6 人；SNG 坐满 6 人才开赛。']},
 {h:'盲注表（起始筹码 10,000）',t:[['级别','小盲 / 大盲','前注'],['1','25 / 50','0'],['2','50 / 100','0'],['3','100 / 200','25'],['4','150 / 300','25'],['5','200 / 400','50'],['6','300 / 600','75'],['7','400 / 800','100'],['8','600 / 1,200','150'],['9','800 / 1,600','200'],['10','1,000 / 2,000','250']],note:'之后每级翻倍，直到决出冠军'},
 {h:'奖励分配',t:[['报名人数','获奖名次','分配（%）'],['6～9','前 2','65 / 35'],['10～18','前 4','40 / 30 / 20 / 10'],['19～27','前 5','37 / 27 / 18 / 10 / 8'],['28～45','前 6','33 / 22 / 16 / 12 / 9 / 8'],['46～100','前 9','30 / 19 / 13 / 10 / 8 / 6.5 / 5 / 4.5 / 4'],['100 以上','约前 15%（向下取整）','后台按模板配置，第 1 名不超过 30%']],note:'SNG（6 人）：第 1 名 65%、第 2 名 35%；按报名人次计，重进一次算一次'},
 {h:'报名与取消',li:['服务端确认名额并完成扣款后才显示报名成功；提交中重复点击不重复扣款。','满员 40002、截止 40001、已报名 40003；延迟报名成功后直接分配座位。','开赛前自行取消：全额退款（含服务费），门票报名退回门票；已开赛不能取消（40004）。','赛事被取消：玩家报名金额与服务费全额退还，门票报名退回门票；保证金全额释放。']},
 {h:'比赛进行与结算',li:['升盲在下一手生效；同一手多人出局，开始时筹码较多者名次较高。','每 55 分钟休息 5 分钟（SNG 不休息）；中途不能离桌。','离开牌桌画面即电脑代打：能过牌就过牌，否则弃牌。','赛事没有时间银行、不能使用延时卡；超时自动过牌，不能过牌则弃牌。','奖励只发放一次（40014）；淘汰可重进时弹窗说明费用。']},
 {h:'卫星赛与保底赛',li:['门票数量 = 奖池 ÷ 主赛报名费（含服务费）；余数现金发给下一名。','例：奖池 1,000、主赛 100 + 10 → 发 9 张门票，余 10 现金。','门票只能用于同一俱乐部指定主赛；不可转让、折现或退款。','保底差额由开赛方承担：开设时先冻结全部保底金额；报名与重进都截止后以最终有效奖池结算差额，只扣不足部分，其余释放；服务费不计入奖池。']}
]},
{id:'08',title:'首页',purpose:'定义首页结构、胶囊切换、各用户状态差异、账户卡、Banner、公告栏、消息中心与俱乐部赛事区块。',sec:[
 {h:'页面结构',li:['由上到下：顶栏 → 胶囊 → Banner → 公告栏 → 账户卡 → 新手教学卡。','接着：玩法快捷入口 → 俱乐部赛事 → 扑克焦点 → 底部导航。','顶栏含：LOGO、客服、语言。','胶囊：精选 / 现金桌 / 锦标赛 / SNG / 赏金赛 / 卫星赛 / 新手；首页不另设大厅，“新手”胶囊永远显示。']},
 {h:'用户状态差异',t:[['状态','判断','首页差异'],['未登录-新用户','设备 / IP 从未登录过','未登录账户卡“还未注册”+【注册】；显示“新手试玩”卡；俱乐部赛事区为空状态卡'],['未登录-老用户','此 IP 曾登录过','“还未登录”+【登录】；不显示“新手试玩”卡'],['游客','游客账号','显示绑定卡“绑定邮箱，加入牌局”；未玩过时显示新手教学卡'],['新手','从未实际玩过任何一局','显示新手教学卡'],['一般玩家','玩过至少一局','隐藏新手教学卡']]},
 {h:'Banner 与公告',li:['Banner 由后台配置，最多 5 张、5 秒自动轮播；显示对象分 全部 / 游客 / 正式账号。','公告栏单行跑马灯；未读数超过 99 显示 99+，游客只计官方公告。','账户卡（正式账号）：账号、玩家 ID、VIP 标签、可用余额、充值 / 提现。']},
 {h:'消息中心',li:['页签：官方公告 / 信息 / 俱乐部消息；只有平台能发消息。','游客只收官方公告；消息永久保留，用户自行删除（删除已读需二次确认）。','俱乐部主收到新的入会申请时实时弹窗“前往审核 / 稍后处理”。']},
 {h:'其他区块',li:['俱乐部赛事：已加入俱乐部尚未开赛的赛事，最多 4 场，按开赛时间排序。','扑克焦点：首页最新 3 则，分类 全部 / 教学 / 俱乐部动态。','“添加到桌面”浮窗可收至右侧；从桌面图标打开时不显示。']}
]},
{id:'09',title:'我的',purpose:'定义个人中心结构、我的账户、头像、门票、我的赛事、牌局记录、游戏设置、VIP 与活动中心。',sec:[
 {h:'页面结构',li:['由上到下：账户卡 → 未读消息 → 6 个快捷入口 → 记录中心 → 活动中心、防沉迷设置、帮助中心 → 退出登录。','账户卡：头像、昵称、账号、玩家 ID、余额、VIP 横条。','快捷入口：记录中心 / 我的门票 / 我的赛事 / 我的俱乐部 / 我的道具 / 添加到桌面。','未登录：只显示头像占位、“你还未登录”与【登录】【注册】（首次访问另有【游客试玩】）。','游客退出警告：“游客账号退出后将无法找回，新人局记录也会一并清除。建议先绑定邮箱。”']},
 {h:'头像、门票、记录',li:['头像：系统头像 4 个页签各 8 个，或上传后圆形裁剪（AI 审核，未通过 50012）。','门票：线上门票（卫星赛）与多阶段赛事各阶段门票；有可使用门票时快捷入口显示红色数字。','牌局记录：筛选 全部 / 现金桌 / 赛事，支持逐街回放；新人局不计入。','游戏设置只在牌桌菜单：音效、背景音乐、显示实际金额 / BB（首次默认 BB）、四色牌面。']},
 {h:'VIP 等级',t:[['等级','当月贡献','返水','每日提现','专属客服'],['VIP0','< 10','0%','5 次 / 50,000',''],['VIP1','≥ 10','15%','5 次 / 50,000',''],['VIP2','≥ 50','17.5%','5 次 / 50,000',''],['VIP3','≥ 200','20%','8 次 / 100,000',''],['VIP4','≥ 500','25%','8 次 / 100,000',''],['VIP5','≥ 1,500','30%','10 次 / 200,000','✓'],['VIP6','≥ 5,000','35%','10 次 / 200,000','✓'],['VIP7','≥ 15,000','40%','不限次 / 500,000','✓']],note:'当月贡献 = 抽水（贡献法分摊）+ 服务费'},
 {h:'评级与返水',li:['当月贡献达门槛即时升级；每月 1 日依上月贡献重新评级，可升可降。','返水每周结算：上周贡献 × 当前等级比例，直接计入可用余额，并加 1 倍流水要求；VIP0 无返水。']},
 {h:'活动中心',li:['页签：进行中 / 已参加 / 已结束。','签到、首存 / 再存（互斥，可选“不参加优惠”）、邀请好友、当期贡献、任务（提交截图或链接）。','手动领取：须于 7 天内领取。','领取检查：游客 00003、已结束 70002、不符合对象 70003、预算用完 70004、重复领取 70005。']}
]},

{id:'11',title:'接口需求说明',purpose:'列出各模块所需的接口、共用规则、关键状态机与 WebSocket 实时事件（路径与字段由后端定义）。',sec:[
 {h:'共用规则',t:[['项目','规则'],['风格','一般请求用 REST；牌桌与实时状态用 WebSocket'],['版本','路径带版本号 /api/v1/...'],['站点','每个请求带站点标识，数据按站点隔离'],['鉴权','token 7 天内有使用自动延长；新设备登录旧 token 立即失效'],['幂等','动钱接口都带请求编号，重复送出只处理一次'],['金额','最小单位整数存储；接口用字串、固定 2 位小数（如 "12.50"）'],['时间','服务端一律 UTC 时间戳，前端按站点时区显示'],['分页','游标分页'],['超时','10 秒未回应提示超时；动钱请求先查询原订单再重试']]},

{id:'13',title:'合规与风控',purpose:'定义牌桌反作弊、反洗钱与资金风控、防沉迷设置、合规基础与账号冻结。',sec:[
 {h:'反作弊',t:[['类型','识别方式'],['伙牌','账号关联（设备指纹、IP、支付方式、网络）+ 牌局行为分析'],['筹码对倒','反复大额输给同一人、不合理下注'],['机器人 / 外挂（RTA）','决策速度、下注模式、长期胜率异常'],['多开 / 代打','同设备多账号、账号由他人操作']],
  li:['处置：告警 → 风控人工调查 → 冻结 / 没收不当得利 / 封号；没收金额按受害玩家损失比例退还，无法认定的归平台。','规则启停只有超级管理员可操作，须填原因。']},
 {h:'反洗钱',li:['制裁名单与 PEP 名单筛查（注册、提现、名单更新时）。','大额或可疑时要求资金来源证明（80006）。','提现风控：1 倍流水、大额转人工、新绑定账户 24 小时、开户姓名须与实名一致。']},
 {h:'防沉迷设置',t:[['工具','规则'],['充值上限','每日 / 每周 / 每月；调低立即生效，调高 24 小时后生效；到账后计入已用'],['时长提醒','15 / 30 / 60 / 120 分钟（默认 60），不能关闭；按钮“离开 / 继续”'],['冷静期','24 小时 / 7 天 / 30 天；确认倒数 3 秒；期间不能充值、入座、报名、玩新人局、购买；不能提前解除'],['自我排除','6 个月 / 1 年 / 5 年 / 永久；确认倒数 5 秒；期间只能提现（80003）；不能提前解除']]},
 {h:'合规基础与账号冻结',li:['地区封锁：IP + 注册地 + 定位；未满 18 岁账号冻结，充值本金退回、赢得金额没收。','发牌随机数取得 GLI 或 iTech Labs 认证。','冻结条件：风控命中、未满 18 岁、制裁名单命中；前台强制弹窗 10013 → 登出回未登录首页。','冻结后：现金桌本手结束离桌结算。','冻结后：进行中赛事电脑代打到结束。','冻结后：未开赛报名全额退款。','冻结后：余额保留不能使用。','冻结后：解冻须经风控审核。']}
]},

有完整记录时同样显示，旧记录只有文字说明时显示文字版；在总后台直接打开完整单手详情，不依赖派牌后台：版面单栏由上而下——①标题列（牌局编号、桌名、盲注、时间、发牌方式，吸顶）②公共牌与回放控制（吸顶）③玩家表（每人一行：座位、位置、玩家、带入、底牌、牌型、投入、收回、净变化；9 人桌即 9 行，当前步骤行动者整行高亮）④各街行动表（按街分组，组标题显示该街公共牌与开始底池；每个动作一行：顺序、位置、玩家、动作、金额、动作后底池；回放到的那一步高亮，尚未播到的变淡）⑤结算（最下方整宽：池表、抽水、Jackpot、全押兑现、核对）；关闭按钮固定在弹窗底部。内容包含：座位与庄位、带入、各街行动与每街底池、公共牌随回放逐步出现、主池 / 边池、抽水、Jackpot 注入、全押兑现、每位玩家投入 / 收回 / 净变化与核对（投入 = 赢得 + 抽水 + Jackpot 注入）；未被跟注的筹码退回原主时单独显示为一步“退回 玩家 金额”；回放可播放、暂停、上一步 / 下一步、跳到开头 / 结尾。底牌默认隐藏（摊牌者于最后一步显示），风控 / 超级管理员可切换“显示底牌”，每次切换记入操作日志。","列表筛选：不设“任意栏位”自由筛选；表格依栏位提供具名筛选（日期栏为区间、固定值栏为下拉、ID / 单号 / 名称类为关键字），页面另有专属筛选列者沿用专属筛选，上方已有的栏位不在筛选列重复出现；ID / 昵称 / 名称 / 单号类栏位一律用输入框，不做下拉；状态等固定值栏位按栏位定义列出全部选项（资料里没有的也列）；单笔限额、费率等数值栏用“最小 ~ 最大”范围筛选（与区间有交集即列出，“不限”视为无上限）；“已开通 / 未开通”类栏位固定为 全部 / 开通 / 未开通；每组栏位名与控件一起换行，“汇出 CSV”固定在右侧；一张表只有一个“重置”。用户管理：用户 ID、昵称、邮箱分开查询（可组合、可重置），筛选列只有 VIP 等级（VIP 0～最高级逐级、可多选）、标签、状态（正常 / 已冻结）、注册日区间，“重置”同时清空三框与筛选；用户详情显示所属俱乐部（名称、ID、身份、加入日期、状态，可跳俱乐部管理）。","表格：所有后台表格在卡片内横向卷动；表格超出宽度时上方显示“可左右卷动”提示，操作栏固定在最右侧（紧邻的状态类栏位——状态、稽核、审核状态、发放状态、结算状态等——一起固定），固定栏左侧有分隔线与阴影。","编号复制：三套后台凡显示牌局编号、充值 / 提现 / 返水 / 奖励等单号、用户 ID 之处（只限业务编号；遮罩金钥、客户端 ID、收款账号、附言、IP 不加），编号右侧有复制图标（点击范围 24×24，hover 提示“复制 编号”）；点编号照旧打开详情，点图标只复制编号、不打开详情，成功显示 Toast“已复制”。复制使用剪贴板 API，不可用时改用备用复制方式。","用户详情的“记录”页签与前台“我的 › 记录中心”同名、同数据源，共 7 项：牌局记录（含单手回放）、赛事记录、返水记录、充值记录、提现记录、奖励记录、商城订单；页签下另列登录记录。按时间倒序；无资料显示“暂无记录”。","用户与合规 › 记录查询（不必先选用户）：同样 7 个页签，各页专属筛选——共通：用户 ID / 昵称、时间区间；返水 / 充值 / 提现 / 奖励 / 商城另加单号，返水 / 充值 / 提现另加状态；牌局另加牌局编号、牌桌、盲注；赛事另加赛事名称；奖励另加“奖励类型”（只列类型：活动奖金、VIP 升级奖励、签到奖励等，活动名称另一栏显示）；商城另加订单类型。分页 50 / 100 / 200、汇出 CSV；单号、牌局编号可点开详情。","充值、提现记录待处理的单据显示“前往处理”，连到“充提与财务”的充值订单 / 提现审核。","资金 › 资金流水（对账）：放资金组最后，只作财务对账汇总（按流水类型统计笔数、收入、支出、净额，可按时间区间），明细请到记录查询。","显示格式：支付方式显示中文名称（银行转账、USDT-TRC20 等）；牌局编号统一为“H + 8 位日期 + 4 码”（如 H202103290115；前台手牌以时分为 4 码，如 H202103291020），电子牌局的后台观看与记录显示保持一致；真人荷官桌使用 T + 8 位 Demo 日期 + 4 码当日流水（如 T202103290001，见 16 派牌管理后台），旧 LH 编号自动迁移。旧存档编号自动迁移：目标编号已被占用时同日 4 码递增改用空号，异常调查记录随编号一一对应。","权限：查询均为只读；财务只看资金类（返水、充值、提现、奖励、商城订单，不显示牌局、赛事与登录记录）；客服、风控、运营看全部（运营待 PM 确认）。","种子资料：前台账号以外，Lucky 平台风控负责调查"],["上游","00 总览、01 全局、03 钱包、05 现金桌、10 后台、11 接口、13 风控、15 异常"],["对应原型","demo/dealer.html"],["原章节","10 后台原第 12 节；迁移不变更既有游戏规则"]],"li":["一荷官一桌：玩家在手机行动，荷官手动录牌、确认玩家行动与系统结算。","总后台负责跨桌记录查询与风控调查；代理后台只查获授权俱乐部的记录，不获得荷官或主管权限。","取代旧版“派牌稽核后台”定位。原电子现金桌行为不变，不把所有站点或原 WAP 自动改为真人模式。"]},{"h":"2. 职责迁移与菜单","t":[["原功能","新入口","迁移要求"],["派牌后台牌局记录与查询","总后台 → 数据中心 → 牌局记录","保留原电子牌局、逐街回放、结算及历史；增加真人来源、荷官和终止状态；前台七类记录不改名"],["稽核","总后台 → 风控 → 稽核","保留执行与历史结果；点数分布只作异常线索，不表述为公平认证"],["异常牌局与调查","总后台 → 风控 → 异常牌局与调查","既有案件保留；真人报告关联手牌、现场快照、主管裁定与结果"],["派牌管理后台","荷官操作台","只保留开桌、当前手牌、录牌、确认牌面、确认结算、暂停上报及本桌操作流水"]]},{"h":"3. 本轮 Demo 范围","t":[["项目","规则"],["玩法与人数","NLH，固定 6 人桌（座位 1～6；入座由演示工具模拟，荷官台不提供入座按钮）"],["盲注与筹码","0.50 / 1.00；每人初始 100.00 模拟筹码"],["抽水","5%，封顶 3.00；未见翻牌不抽水"],["桌台绑定","一名荷官同一时刻只绑定一桌；本机沙箱只运行一张桌，LIVE-01 / LIVE-02 二选一；他人已占用的桌不能操作"],["示范账号","dealer_01 / dealer_02，密码 123456，验证码 000000"],["存档","独立本地存储 dz_live_dealer_v1；不改 WAP 钱包、牌桌、手机计时或实际资金"],["时间口径","全站 App 时钟：Demo 日期 2021-03-29 + 真实时分，格式 YYYY-MM-DD HH:mm"],["后台语言","三套后台只提供简中与英文，偏好存 dz_admin_lang，与前台语言分开"]],"li":["## 荷官与玩家分工","本轮新定案（2026-10-21）：底牌由设备识别并绑定座位（Demo 为模拟识别），荷官不录入、不看牌面，只确认“底牌已发出”；读取缺失、重复或座位不符不得下注，只能重扫或暂停呼叫督导。公共牌由荷官录入或扫描。","荷官台不提供玩家手机模拟或任何代玩家操作；Demo 由系统替模拟玩家自动行动，结果只读显示在座位旁。","玩家在手机发起行动，经服务端校验并成功提交后立即生效；荷官不确认，不能改金额、代下注或补填行动。","系统自动计算比牌、主池边池、未跟注退回、平分尾差与抽水；荷官核对后确认一次，不能手输赢家或改派奖。","结算确认后写入总后台“数据中心 → 牌局记录”（来源：真人荷官），单手详情含座位、底牌、逐步行动与每步底池、主池边池、抽水与核对。","## 英文模式要求","英文模式整页不残留中文：菜单、表头、筛选、按钮、Toast、确认弹窗、空状态、单手详情、CSV 表头、示范账号卡片。","拼接句用整句模板；用户输入的资料不翻译；内容管理三语内容显示英文版本。","## 本轮不做","真实视频上传、真实手机 WS、现场设备识别、多人跨服务器锁、真人赛事、Jackpot、全押兑现、多次发牌、实际出入金。","主管模拟身份只是演示开关；正式版须独立账号、权限与会话。","实体底牌的受控读取方式（摄像或指定录入工位）须在正式接现场前确认。"]},{"h":"3.1 荷官台画面","li":["暗黑金牌桌视角：椭圆牌桌，荷官位在下方中央，固定 6 个座位（座位 1～6），位置与编号不变；空位显示空座框与编号，入座或离座时不重排。","桌心 5 个公共牌格（翻牌 3、转牌 1、河牌 1）；未发为虚线空框，本街待录入格高亮；上方显示街次与手牌编号，下方显示底池与抽水。","座位只放头像、昵称、筹码、本轮下注、庄 / SB / BB 标记、行动中高亮与两张牌背；行动倒数为头像外圈金色圆环，与 20 秒截止时间同源。","座位整块放在金色桌边外侧，放不下才放内侧，不跨桌边线；下注筹码放在桌边内侧；座位之间、与公共牌区都不重叠。","9 个座位头像取自 32 张头像池，互不重复；摊牌时依摊牌规则只翻开未弃牌座位的底牌并标牌型（弃牌者不公开），英文牌型用 Title Case 且不折行。","右侧只有荷官操作面板（开桌、确认底牌已发出、公共牌录牌、确认牌面、结算、暂停报告），不含玩家手机模拟；操作流水折叠在下方；演示工具为独立侧栏。","顶栏说明为“演示版：模拟识别与模拟玩家，不与前台连动”，1280 宽不截断；标题不用点号拼接。","主管裁定面板吸底按钮预留高度，“裁定原因”输入框可完整卷出。"]},{"h":"4. 完整状态流程","p":"开桌检查 → 待开手 → 确认洗牌装靴 → 下盲注 → 发底牌（按钮左手第一位起顺时针，每人先第 1 张）→ 确认牌面 → 翻前行动（服务端校验提交后立即生效）→ 进入下一圈、烧牌并录翻牌 → 翻牌行动 → 录转牌 → 转牌行动 → 录河牌 → 河牌行动 → 系统计算 → 荷官确认结算 → 归档 → 下一手或关桌","t":[["阶段","荷官操作","系统校验与玩家展示"],["开桌","选桌，输入荷官名字（必填），确认牌具、座位、设备；在座人数来自玩家入座（Demo 由演示工具模拟）","一人一桌；显示规则与模拟带入；已有负责荷官的桌不能抢占"],["开手","勾选已洗牌装靴，点击开始新局（Start Hand）","至少两名有筹码玩家；系统轮转庄位、下盲注、生成唯一手牌编号"],["发底牌","本轮新定案：底牌由设备识别并绑定座位（Demo 为模拟识别），荷官不录入、不看牌面，只确认底牌已发出；按钮左手第一位起顺时针发牌","每录一张，对应座位显示一张牌背；共 2 × 参与人数；重复牌禁选，未满不能确认；确认前可撤销最后一张"],["确认发牌","核对本批实际牌面后确认","已确认牌荷官不可改写；此时才开启玩家行动倒数"],["玩家行动","荷官不确认，只在桌面只读查看","服务端校验并成功提交后立即生效，非法、重复、过期不推进；座位旁显示动作与下注额；超时系统自动过牌或弃牌"],["后续开牌","本街下注完成后点进入下一圈（Next Street），确认烧 1 张，再录 3 / 1 / 1 张公共牌","本街行动结束才开放；不录烧牌面；不可超量或重复；全押无人可行动时逐街续录"],["摊牌与计算","核对自动生成的结果","系统比牌分池；全部弃牌只剩一人时不补开公共牌，直接计算"],["结算确认","核对后点确认结算（Declare Winner）；有疑问点呼叫督导（暂停）","金额守恒通过才可确认；重复请求不重复派发；总后台产生记录"],["关桌","本手已结算、已终止或尚未开手时关桌","未完成手牌不能关桌；余额只是本桌模拟筹码"]],"li":["## 手牌编号","真人桌：T + 8 位 Demo 日期 + 4 码当日流水，例如 T202103290001；当日递增不重复。","当日用到 9999 即拒绝开新手，不加长、不回绕，次日从 0001 重新开始。","电子桌维持 H 开头；旧 LH 编号载入时按开局先后迁移，异常事件编号（INC-手牌编号-序号）与日志一并更新。"]},{"h":"5. 行动倒数与暂停同步","li":["行动倒数预设 20 秒，是本 Demo 独立参数，不改电子 WAP 原倒数。","荷官台与手机两侧按同一截止时间计算，不各自减秒。","玩家行动经服务端校验并成功提交后立即生效；系统推进下一位玩家并启动其倒数。荷官无需确认玩家行动，只确认牌面与系统结算结果。非法、重复、过期（state_version 不符）的行动一律拒绝，不推进牌局。","超时由系统自动处理：可过牌则过牌，否则弃牌。","## 暂停","暂停按钮固定在工作台右上角；点击立即冻结倒数，并禁用发牌、下注、结算、开下一手。","先冻结再填报告，报告未写完也不继续计时。","保存原阶段、玩家、余秒、底池、牌面、已生效行动和日志；暂停期间禁止行动、不推进倒数；恢复时从冻结余秒继续，已生效行动不重给下注机会。","刷新读取相同存档与截止时间，页面切到背景不会让计时漂移。","## 玩家提示（正式接 WAP 时于玩家端显示；荷官台已无手机模拟区）","显示事件编号；不显示他人底牌、证据、作弊推测、主管内部备注或预计恢复时间。","终止时提示“本手已终止，相关投入正按处理结果退回”；成功退回后才显示“已退回”。"],"note":"暂停文案：此牌局异常暂停中，请稍等。工作人员正在核查，您的筹码与已提交行动已保留，暂停期间不计算行动时间。"},{"h":"6. 错牌、掉牌与争议处理","t":[["类型","荷官第一步","上报必查","主管处理原则"],["未确认录入误点","撤销当前批次最后一张并重录","尚未确认且未向玩家发布","不算实体错发；不覆盖已确认记录"],["已确认牌面与实体不符","立即暂停，不自行改牌","位置、原录入、真实牌 ;(()=>{const d=window.PRD_DOCS.find(x=>x.id==='16');if(d)d.sec.push({h:'荷官位直播示意',li:['【定案】统一 Demo 时钟（2026-10-21，R29-DLR-04）：荷官台全部时间（D.ts：牌局编号 T + 日期 + 4 码、操作流水、归档）与排班共用 LDShift.now()，日期随真实日数前进。新的一手按开手当天日期编号，每日从 0001 起、序号不可重复；跨过午夜仍在进行的手牌保留开手时的编号；结算、交接等事件各自记录实际发生时间；历史记录日期一律不改。【定案】接班与补排（R29-DLR-06）：接班前必须已有本桌有效班次；无人可接时，由总后台补排（允许临时补排）。下班当下无合格接班人时，牌桌维持“等待荷官接班”，画面提示“本桌尚无可接班的有效班次，请由总后台排定接班班次。”，并产生总后台待办“真人桌待排接班”（运营、高优先、2 小时；只读 dz_ld_shifts 与牌桌存档，以 LDShift.needsCover() 判断）。补排后荷官台无需重新整理即出现接班表单；待办在补排后仍保留（状态 pending_takeover），接班真正完成后才关闭，并允许开新局。刚交班的荷官尝试接回时显示原因（R29-DLR-05）。','排班时钟与跨日（2026-10-21，R29-DLR-01）：判断班次是否到点使用会往前走的 Demo 排班时钟（LDShift.now）：日期为 App.today() 加上自首次使用起经过的真实日数，时分取真实时钟，跨过 24:00 日期即进一天；“24:00”视同次日 00:00。跨日班次（如 22:00～次日 06:00）在次日 06:00 到点；顶栏以“次日”标示。值班中途取消与接班资格（R29-DLR-02）：班次在值班中途被改为已取消时比照到点处理——进行中的这一手继续打完并结算，之后不开下一手；本手进行中显示“班次已取消，完成本手后等待接班”，结算后显示“等待荷官接班”；取消时没有进行中手牌则立即进入待接班；取消不自动流局、退款，也不暂停当前手，紧急安全事件另走呼叫督导（暂停）。接班人须在本桌有当前有效班次（已排定或值班中且涵盖现在），且未负责其他桌；未指定接班人不代表任何荷官都可接班；刚交班的荷官不能接回本班，续班须由总后台延长班次或重新排班，再经牌具核对后上桌；没有符合资格的接班人时保持“等待荷官接班”，不开新局。','荷官排班（2026-10-21，R28-DLR-06）：排班资料由总后台排班页维护，荷官台只读本人班次。共用资料存 localStorage dz_ld_shifts（阵列），每笔 {id, dealer（荷官账号）, table, start, end, tz, next（接班人账号，可空）, status}；时间为 Demo 时钟 YYYY-MM-DD HH:mm；status 为 scheduled／on_duty／ended／handed_over／cancelled。校验统一用 LDShift.validate：同一荷官班次不可重叠、同一牌桌值班时间不可重叠（cancelled 不计），另检查必填、结束晚于开始、接班人不能是本人。荷官台顶栏显示“本班 HH:mm～HH:mm　接班人 账号”（无排班显示“今日无排班”）。班次到点时：牌局中则本手照常打完并结算，之后不开下一手；两手之间则立即停止开新局；画面显示“班次已结束，等待接班”。接班荷官须以本人账号登录、输入名字并完成牌具核对，按“确认接班”后才能开新局。等待接班期间玩家可正常离桌结算，不自动流局或退款，洗牌提示照旧显示。自动开桌与下班后关桌等其余排班规则待 PM 定案。','在座人数与满座提示统一按座位总数计算（含筹码为 0 者）；“满 2 人才能开始新局”另按有筹码的人数判断（R28-DLR-07）。','Demo 入座与开局条件（2026-10-21，R28-DLR-02／03）：荷官台不提供入座／离座，只显示在座情况；玩家入座来自未来的真人桌前台，Demo 以演示工具“模拟玩家入座／离座”代替（跟随“显示演示按钮”开关，预设隐藏；只作用于真人荷官桌，不连 WAP 现金桌；只能在两手之间操作）。第一位玩家入座起，桌面显示“目前洗牌中，稍后开桌”（英文 Shuffling, the table will open shortly），开局后隐藏。荷官须先完成开桌准备（荷官名字、牌具核对）；在座不足 2 人时“开始新局”不可按，并显示“在座玩家不足 2 人，无法开始新局。”。按排班自动开桌、排班设定与下班处理待 PM 定案，本轮不做。','Demo 荷官名字与占位（2026-10-21，R28-DLR-01）：开桌前必须输入荷官名字（最多 20 字），未填不能确认开桌；名字显示在顶栏、直播示意、操作流水（名字加账号）与总后台牌局记录的“荷官”栏。更换荷官时接班荷官也须输入名字，交接记录保存交出／接班名字。每次开始新局即产生手牌编号（T + 8 位日期 + 4 码当日连号，当日最多 9999 手），立即显示在桌面、流水与记录。开桌前桌面与顶栏显示“尚未开桌”，开桌后未开手显示“待开始新局”，不再显示“—”。','牌桌下方中央显示荷官图片预览、荷官账号及直播示意（VIDEO DEMO）标识。当前为本地静态素材，不接真实视频；窄屏缩小，不承担发牌操作。']});})();

;(()=>{const d=window.PRD_DOCS.find(x=>x.id==="16");if(d)d.sec.push({"h": "公共牌、设备录牌与督导介入（待开发规格）", "li": ["## 12. 公共牌、设备录牌与督导介入（2026-10-21 新增规格）", "本节补充正式产品要求，不代表扫描器、脚踏确认、换班、回滚及视频切换已在Demo实现。当前Demo的底牌为模拟识别（荷官只确认已发出），公共牌可手动录入或扫描录入（模拟读数），转手动须选原因。第3节独立模拟、不接WAP钱包的边界不变。", "### 12.1 公共牌与行动顺序", "| 阶段 | 荷官步骤 | 系统放行条件与行动顺序 |", "|---|---|---|", "| 翻牌 Flop | 确认烧1张，再录入并核对3张公共牌 | 翻前下注完成；从庄家左侧顺时针首位仍在局中且可行动的玩家开始 |", "| 转牌 Turn | 再确认烧1张，录入并核对第4张公共牌 | 翻牌下注完成；重新从庄家左侧首位可行动玩家开始 |", "| 河牌 River | 再确认烧1张，录入并核对第5张公共牌 | 转牌下注完成；同上顺序，完成最后一轮下注 |", "通常小盲先行动，但已弃牌、全押或不参与本手的座位须跳过；两人局翻牌后大盲先行动。全押且无人需要继续行动时不启动虚假的行动倒数，按规则继续发剩余公共牌；只剩一名未弃牌者则直接结算，不强行补牌。烧牌只记录完成事件和序号，不向玩家公开牌面；发出的每张公共牌保留街次、位置、录入来源、确认人和时间。", "### 12.2 荷官按钮与前置条件", "| 按钮 | 何时可用 | 行为／失败处理 |", "|---|---|---|", "| 开始新局 Start Hand | 上手已结算／终止、本桌归属有效、人数和筹码满足规则 | 确认洗牌及设备就绪；采用发牌靴的现场另确认装靴。系统生成手牌号并执行盲注，不由荷官修改下注 |", "| 确认牌面 Card Scanned / Confirm | 扫描或手输形成待确认草稿 | 显示当前目标、数字牌面与来源，检查数量、重复牌、街次；确认后才写入有效发牌事件。脚踏设备与点击共用命令，去抖及幂等，不能连续确认多张 |", "| 手动输入 Manual Entry | 扫描失败或已选择手动模式，且当前阶段允许录牌 | 虚拟花色／点数键盘；扫描模式转手输须填写原因、关联失败读数。不可通过手输修改已确认牌；底牌显示按权限遮罩 |", "| 重新扫描 Scan Retry | 当前有未确认错误读数且扫描设备在线 | 清除未确认草稿并重新请求该位置读数；保留原读数与失败日志。旧请求迟到结果丢弃，不清除已确认的牌，不删除历史事件 |", "| 进入下一圈 Next Street | 系统确认本街投注完成、无异常暂停 | 提示烧牌并开放本街牌位；不得靠按钮跳过玩家行动或绕过烧牌确认。重复点击不能多发牌 |", "| 确认结算 Declare Winner | 系统已完成比牌、分池与金额校验 | 显示赢家和计算明细，荷官仅确认，不能手选赢家或金额。服务端提交成功后才播放结算动画和更新筹码；超时先查询原结果 |", "| 更换荷官 Dealer Change | 通常限两手间，无未处理异常和未完成的牌面录入 | 原荷官发起、新荷官独立登录接收、服务端原子转移绑定；记录开始结束时间和交接人。手中紧急换班须先暂停并由主管批准，不改变牌局快照 |", "| 呼叫督导 Call Floor / Supervisor | 当前桌异常或争议 | 一键暂停游戏与倒数、生成事件、保留现场，再补报告；主管认领事件并获得裁定权限，荷官保留查看与补充证据权限，不是转交平台管理员全权 |", "换班服务时长、手数、异常次数作为记录；绩效评分口径另定，不以异常少自动评价更好。扫描／脚踏设备未接入时明确显示“设备未接入”，不可用模拟成功伪装真实读取。扫描到烧牌或错误座位的读数不得自动当作公共牌确认。", "### 12.3 总后台督导工作台", "入口：总后台 → 风控管理 → 真人桌督导。与异常牌局与调查共用事件，不另建重复案件。React／Vue不是产品约束；实时状态须由服务端事件同步，断线后获取完整快照。", "| 页签 | 输入查询 | 筛选 | 内容及动作 |", "|---|---|---|---|", "| 实时桌台 | 桌号、手牌号、荷官账号、俱乐部ID | 站点、桌状态、街次、设备／串流状态、暂停时长 | 进行中状态、倒数、最近已生效行动、视频预览；暂停、认领、查看报告 |", "| 异常处置 | 事件ID、案件号、手牌号、玩家ID | 类型、严重度、待认领／处理中／待执行／已处理、负责人、发生时间 | 现场快照、行动序、原读数、暴露范围、证据、处置预览及结果 |", "| 处置记录 | 裁定单号、原事件ID、操作者ID | 回滚／流局／比牌／恢复、状态、处理时间 | 原状态、新状态、受影响行动、逐玩家金额、审批与执行日志 |", "| 荷官交接 | 交接单号、桌号、交出／接班账号 | 状态、正常／紧急、起止时间 | 绑定变更、服务时段、手数与异常记录，不开放修改绩效原始记录 |", "| 视频与设备 | 桌号、设备ID、串流ID | 主／备、在线／离线／切换中／失败、时间 | 设备状态、切换与中断历史；凭证不在普通列表展示 |", "### 12.4 督导处置规则", "| 操作 | 前置与确认 | 状态及资金处理 |", "|---|---|---|", "| 回滚上一动 Rollback Action | 先暂停并认领；选择最后有效检查点，预览受影响动作／牌面、玩家与筹码差额，填写原因；有已暴露信息或后续有效行动时禁止无条件一键回退，转正式裁定 | 以追加的失效事件与补偿事件处理，不删除原行动。只退被裁定无效的投注；保留此前有效投注。通常退回桌上筹码，不再同时加到钱包；已结算手牌不能直接回滚 |", "| 流局与退款 Cancel Hand / Refund | 严重牌序错误等由主管裁定；断网先检查服务端快照，不因客户端断线自动流局 | 本手未结算且按全额流局裁定时恢复本手开始筹码，撤销本手相关抽水／彩金事件；此前手牌结果不变。继续在桌则回桌上筹码，离桌才释放到钱包；部分失败显示处理中／失败，成功后才显示已退回 |", "| 强制比牌 Force Showdown | 仅暂停且牌面完整有效、无未解决争议投注、所有玩家已全押或本轮合法行动已完成时允许主管触发计算 | 不是任意翻开未摊牌底牌，不剥夺尚存合法行动权，不手输赢家。公开信息限制按游戏规则，结算仍由系统计算、荷官确认；不满足条件则不可用 |", "| 冻结桌台 Freeze Table / Pause | 人工异常或服务端明确异常事件触发 | 立即停止新动作和倒数，保留状态；默认保持摄像采集与内部录像取证，不自动中断证据。确需停用玩家端视频时单独切备用字卡；画面注明暂停，不冒充实时视频 |", "| 切换备用串流 Switch Stream | 主流异常、有可用备流或备用字卡；确认目标桌号、镜头与健康状态 | 记录切前切后流ID和时间；切换失败保留异常状态。视频恢复不等于牌局恢复，需完成状态核对后独立恢复 |", "| 恢复牌局 Resume | 裁定执行成功、资金核对通过、设备就绪，无未处理阻断项 | 荷官确认恢复；使用冻结余秒与已生效行动，不重新给玩家一次下注机会 |", "涉及资金的回滚／退款必须遵守10的双人复核与独立审批要求；主管提交处置不等于自审批准，荷官核对也不自动等于财务批准。请求绑定状态版本、检查点、处置单号和幂等键。处置途中新旧事件竞态必须由服务端拒绝；通知玩家只显示暂停、处理进度及本人资金结果，不公开内部证据或他人隐藏底牌。", "### 12.5 新增验收与实现边界", "待开发验收：扫描重复／乱序／迟到读数、手动备用留痕、脚踏连触、每街烧牌与3/1/1张校验、两人局大盲先行动、弃牌及全押座位跳过、Next Street不可跳过行动、并发确认幂等、交接互斥、主管认领冲突、回滚有效／无效投注分界、已暴露牌禁止简单回退、退款不同时进入桌筹码和钱包、已结算单的独立冲正流程、比牌前置条件、录像不中断、备流失败及恢复分别确认。", "本次记录规格；当前Demo已有手动录牌、系统计算确认、暂停上报与主管模拟，硬件扫描、真实换班、独立督导后台、受控回滚、强制比牌和备流切换尚未实现。不得将增加PRD按钮清单标为功能已完成。"]});})();

;(()=>{/* R30-UI-70：登录与注册共用同一页面（01、09 同步） */['01','09'].forEach(id=>{const d=window.PRD_DOCS.find(x=>x.id===id);if(d&&d.sec)d.sec.push({h:'登录与注册共用同一页面',li:['登录与注册共用同一页面（PM 定案，2026-10-21，R30-UI-70）：登录与注册使用同一个登录页（通行密钥登录、邮箱验证码、Google／Facebook／Apple），注册版只换标题与底部切换文字（“还没有账号？注册”／“已有账号？登录”），注册另须勾选年满 18 岁与条款；“我的”卡片的登录／注册、needLogin 等所有入口都走这一页或其弹窗形态。游客绑定（needBind）仍为“绑定邮箱”，额外说明游客记录转入正式账号。未登录进入“我的”、俱乐部、充提、商城：新用户（本机未曾使用）自动弹出注册，老用户弹出登录，弹窗背景为该页；同一次打开网站四页共用只自动弹一次（sessionStorage 记录），关闭后停在当前页，显示未登录空状态与“登录／注册”入口，不显示私人资料、不回上一页，用户仍可自行点登录；需登录的业务操作照原规则拦截（needLogin／needBind）。首页不自动弹出。']});});})();

;{const d=window.PRD_DOCS.find(x=>x.id==="06");if(d){d.sec.push({"h":"牌局管理权限（R30-UI-72）","li":["俱乐部创建者与管理员不可暂停牌桌；现金桌“请玩家离桌”“解散牌局”保留，本手结束后生效。","赛事只能在开赛前取消，开赛后按钮停用并说明“赛事已开赛，无法取消”；开赛前取消按既定规则全额退报名费与服务费，门票退回（PM 定案，2021-03-29）。"]});}}
;(()=>{/* R31-DLR-01～04：荷官台本轮新定案（16 第 13 节） */const d=window.PRD_DOCS.find(x=>x.id==='16');if(d&&d.sec)d.sec.push({h:'13. 荷官台本轮新定案（2026-10-21）',li:["本节为本轮新定案（2026-10-21），不代表硬件已实现；Demo 以模拟识别、模拟玩家演示。", "删除“玩家手机（模拟）”与所有代替玩家的操作（弃牌、跟注、全押、加注到、提交加注）；荷官台不显示玩家底牌，也没有任何玩家视角画面。", "行动阶段右侧只显示“等待座位 N 在手机行动”与倒数；Demo 由系统替模拟玩家在倒数内行动，偶有超时，结果即时生效，座位旁只读显示动作。", "底牌由设备识别并绑定到正确座位，荷官端不显示牌面；荷官只按“确认底牌已发出”，表示实体牌已发出，不等于读取成功。读取结果出现缺失、重复或座位不符时一律不得进入下注，只能重扫，或暂停并呼叫督导；不得随意补牌。Demo 画面标示“模拟识别”。", "公共牌照旧由荷官录入或扫描；底牌发出时已由发牌靴扫描、系统已知，录入公共牌时已发出的底牌一律停用、不可选（只停用、不标座位，外观同已用牌，不显示牌面）。", "系统按摊牌规则亮牌：只有进入摊牌且未弃牌者亮牌，弃牌者底牌不自动公开。", "暂停时玩家端只显示“牌局暂停中”。", "荷官保留：开桌、公共牌录牌与扫描、烧牌、进入下一圈、结算确认、交接、呼叫督导。", "只用于公共牌。点“手动输入”后先出现 5 个单选：扫描设备未接入或离线／读数失败（已重试 2 次）／牌面污损或反光／牌靴卡牌／其他；选定后才切到手动。", "选“其他”时展开输入框，限 1～50 字。原因写入操作流水，并随牌局归档进入总后台记录；中英双语。", "荷官台以 100vh／100dvh 的 flex 版面呈现，整页不卷动；牌桌区按可用宽高等比缩放，座位、公共牌、直播示意一起缩放。", "右侧面板独立卷动；开始新局、确认牌面、进入下一圈、确认结算等关键按钮吸底常驻，呼叫督导固定在顶栏。", "演示工具为独立侧栏，与前台 WAP 导览面板同一套样式，只在勾选“显示演示按钮”时出现，不放在荷官操作区。", "分四块：身份（荷官／接班荷官／主管）；目前画面（当前阶段与本 PRD 相关章节摘要）；情境触发（模拟玩家入座／离座、玩家超时、底牌识别缺失／重复／座位不符、公共牌扫描失败、设备离线、断线、班次到点、班次取消、跨午夜）；快速前往（开桌前、发底牌、各街、摊牌结算、等待接班）。", "顶栏说明：演示版：模拟识别与模拟玩家，不与前台连动。"]});})();
;(()=>{/* R32-DLR-03：固定 6 人桌 */const d=window.PRD_DOCS.find(x=>x.id==='16');if(d&&d.sec)d.sec.push({h:'13.5 固定 6 人桌（R32-DLR-03）',li:['真人荷官桌一律为 6 人桌，座位固定 1～6 号，取代 2～9 人设计。','座位位置与编号固定；空位显示空座框与编号；入座或离座时其他座位不重排，入座补最小空座号。','庄位、盲位按固定座号顺时针轮转并跳过空座；流水与记录用固定座号。','演示入座上限 6 人，满座提示与判断同一口径（在座 N / 6）。','旧可变座位存档迁移为 6 座（超过 6 人只保留前 6 座）。旧存档一律以 6 人桌显示（PM 定案，2021-03-29）。']});})();

<script>
(function(){
  var D=window.PRD_DOCS,E=window.PRD_ERRORS;
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function table(t){var h='<div class="tw"><table><thead><tr>'+t[0].map(function(c){return'<th>'+esc(c)+'</th>'}).join('')+'</tr></thead><tbody>';
    for(var i=1;i<t.length;i++)h+='<tr>'+t[i].map(function(c){return'<td>'+esc(c)+'</td>'}).join('')+'</tr>';return h+'</tbody></table></div>'}
  var cats=[];E.forEach(function(e){if(cats.indexOf(e[1])<0)cats.push(e[1])});
  function errBlock(){return '<div class="ef" id="ef"><button class="on" data-c="">全部</button>'+cats.map(function(c){return'<button data-c="'+esc(c)+'">'+esc(c.replace(/（.*/,''))+'</button>'}).join('')+'<input id="eq" placeholder="筛选编号或文案"></div><div class="ecnt" id="ecnt"></div><div class="tw err"><table><thead><tr><th>编号</th><th>分类</th><th>文案</th><th>前端处理</th><th>按钮 / 跳转</th></tr></thead><tbody id="ebody">'+
    E.map(function(e){return'<tr data-c="'+esc(e[1])+'"><td>'+e[0]+'</td><td><span class="tag">'+esc(e[1].replace(/（.*/,''))+'</span></td><td>'+esc(e[2])+'</td><td>'+esc(e[3])+'</td><td>'+esc(e[4])+'</td></tr>'}).join('')+'</tbody></table></div>'}
  var html='<div class="intro" id="intro"><h2>德州扑克 WAP 产品需求文档（摘要）</h2><p>本页汇整 PRD 00～16 的文档目的、核心规则与关键表格，供面试官与合作方快速了解产品规格。金额均为 USDT 等值，数值可于后台调整。</p><div class="stats"><div><b>'+D.length+'</b><span>份文档</span></div><div><b>'+D.reduce(function(a,d){return a+d.sec.length},0)+'</b><span>个章节</span></div><div><b>'+E.length+'</b><span>个错误码</span></div><div><b>3</b><span>套后台</span></div></div></div>';
  var toc='<div class="tt">文档目录</div>';
  D.forEach(function(d){
    html+='<section class="doc" id="d'+d.id+'"><div class="dh"><span class="no">'+d.id+'</span><h2>'+esc(d.title)+'</h2></div><div class="pp"><b>文档目的：</b>'+esc(d.purpose)+'</div>';
    toc+='<div class="grp" data-id="'+d.id+'"><button class="d" data-id="'+d.id+'"><span class="n">'+d.id+'</span>'+esc(d.title)+'<span class="ar">▶</span></button><div class="subs">';
    d.sec.forEach(function(s,i){var sid='d'+d.id+'-'+i;
      toc+='<a href="#'+sid+'" data-s="'+sid+'">'+esc(s.h)+'</a>';
      html+='<div class="sec" id="'+sid+'"><h3>'+esc(s.h)+'</h3>';
      if(s.p)html+='<p>'+esc(s.p)+'</p>';
      if(s.t)html+=table(s.t);
      if(s.li)html+='<ul>'+s.li.map(function(x){return x.indexOf('## ')===0?'<li class="lg">'+esc(x.slice(3))+'</li>':'<li>'+esc(x)+'</li>'}).join('')+'</ul>';
      if(s.note)html+='<div class="note">注：'+esc(s.note)+'</div>';
      if(s.errors)html+=errBlock();
      html+='</div>';});
    toc+='</div></div>';html+='</section>';});
  html+='<div class="empty" id="empty">没有找到相关内容，换个关键字试试</div><div class="foot">内容依 PRD 00～16 整理，完整规格以正式文档为准</div>';
  var body=document.getElementById('body'),tocEl=document.getElementById('toc'),prd=document.getElementById('prd'),main=document.getElementById('main');
  body.innerHTML=html;tocEl.innerHTML=toc;
  var mobile=function(){return window.matchMedia('(max-width:860px)').matches};
  function go(el){if(!el)return;el.scrollIntoView({block:'start'});prd.classList.remove('drawer')}
  tocEl.addEventListener('click',function(ev){var b=ev.target.closest('.d');var a=ev.target.closest('a');
    if(a){ev.preventDefault();go(document.getElementById(a.getAttribute('data-s')));return}
    if(b){var g=b.parentNode;var wasOn=b.classList.contains('on');g.classList.toggle('open',!(wasOn&&g.classList.contains('open')));go(document.getElementById('d'+b.getAttribute('data-id')));}});
  document.getElementById('menuBtn').onclick=function(){prd.classList.add('drawer')};
  document.getElementById('mask').onclick=function(){prd.classList.remove('drawer')};
  // 目录高亮
  var docs=[].slice.call(body.querySelectorAll('.doc'));
  function spy(){var top=mobile()?130:90,cur=null;docs.forEach(function(d){if(!d.classList.contains('hide')&&d.getBoundingClientRect().top<top+40)cur=d});if(!cur)cur=docs.filter(function(d){return!d.classList.contains('hide')})[0];
    [].forEach.call(tocEl.querySelectorAll('.d'),function(b){b.classList.toggle('on',cur&&('d'+b.getAttribute('data-id'))===cur.id)})}
  main.addEventListener('scroll',spy);window.addEventListener('scroll',spy);spy();
  // 错误码表筛选
  var ecat='',eq='';var rows=[].slice.call(document.querySelectorAll('#ebody tr'));
  function efilter(){var n=0;rows.forEach(function(r){var ok=(!ecat||r.getAttribute('data-c')===ecat)&&(!eq||r.textContent.toLowerCase().indexOf(eq)>=0);r.style.display=ok?'':'none';if(ok)n++});document.getElementById('ecnt').textContent='共 '+n+' 条';return n}
  document.getElementById('ef').addEventListener('click',function(ev){var b=ev.target.closest('button');if(!b)return;ecat=b.getAttribute('data-c');[].forEach.call(this.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b)});efilter()});
  document.getElementById('eq').addEventListener('input',function(){eq=this.value.trim().toLowerCase();efilter()});
  efilter();
  // 全文搜索 + 高亮
  var orig=new Map();
  [].forEach.call(body.querySelectorAll('.sec'),function(s){orig.set(s,s.innerHTML)});
  var origIntro=document.getElementById('intro');
  function hl(node,re){if(node.nodeType===3){var t=node.nodeValue;if(!re.test(t))return;re.lastIndex=0;var f=document.createDocumentFragment(),last=0,m;
      while((m=re.exec(t))){f.appendChild(document.createTextNode(t.slice(last,m.index)));var k=document.createElement('mark');k.textContent=m[0];f.appendChild(k);last=m.index+m[0].length}
      f.appendChild(document.createTextNode(t.slice(last)));node.parentNode.replaceChild(f,node);return}
    if(node.nodeType===1&&!/^(INPUT|BUTTON|MARK)$/.test(node.tagName))[].slice.call(node.childNodes).forEach(function(c){hl(c,re)})}
  var timer;
  function search(){var q=document.getElementById('q').value.trim();document.getElementById('sbox').classList.toggle('has',!!q);
    var re=q?new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'):null,secHit=0,docHit=0;
    orig.forEach(function(h,s){s.innerHTML=h});
    // 重新绑定错误码表（innerHTML 重建）
    rows=[].slice.call(document.querySelectorAll('#ebody tr'));bindErr();
    docs.forEach(function(d){var id=d.id.slice(1),title=d.querySelector('.dh').textContent+d.querySelector('.pp').textContent;var titleHit=re&&re.test(title);if(re)re.lastIndex=0;var any=false;
      [].forEach.call(d.querySelectorAll('.sec'),function(s){var hit=!re||titleHit||s.textContent.toLowerCase().indexOf(q.toLowerCase())>=0;s.classList.toggle('hide',!hit);if(hit&&re&&!titleHit)secHit++;if(hit)any=true;
        if(re&&hit){if(s.querySelector('#ebody')){eq=q.toLowerCase();var inp=s.querySelector('#eq');inp.value=q;efilter();if(!s.querySelector('#ebody tr:not([style*="none"])')){eq='';inp.value='';efilter()}}hl(s,re)}});
      if(re&&titleHit){hl(d.querySelector('.dh'),re)}
      d.classList.toggle('hide',!any);if(any)docHit++;
      var g=tocEl.querySelector('.grp[data-id="'+id+'"]');g.classList.toggle('hide',!any);g.classList.toggle('open',!!re&&any);
      [].forEach.call(g.querySelectorAll('.subs a'),function(a){var s=document.getElementById(a.getAttribute('data-s'));a.style.display=s.classList.contains('hide')?'none':''})});
    origIntro.style.display=re?'none':'';
    document.getElementById('empty').style.display=re&&!docHit?'block':'none';
    document.getElementById('hint').textContent=re?(docHit?'找到 '+docHit+' 份文档':'无结果'):'';
    if(re){var f=body.querySelector('mark');if(f)f.scrollIntoView({block:'center'})}else main.scrollTop=0;spy()}
  function bindErr(){var ef=document.getElementById('ef');ef.onclick=function(ev){var b=ev.target.closest('button');if(!b)return;ecat=b.getAttribute('data-c');[].forEach.call(ef.querySelectorAll('button'),function(x){x.classList.toggle('on',x===b)});efilter()};
    document.getElementById('eq').oninput=function(){eq=this.value.trim().toLowerCase();efilter()};ecat='';eq='';efilter()}
  document.getElementById('q').addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(search,150)});
  document.getElementById('qx').onclick=function(){document.getElementById('q').value='';search()};
  try{var sg=document.querySelector(".topbar .seg");if(mobile())sg.scrollLeft=sg.scrollWidth}catch(e){}
  var p=new URLSearchParams(location.search).get('q');if(p){document.getElementById('q').value=p;search()}
})();
</script>
